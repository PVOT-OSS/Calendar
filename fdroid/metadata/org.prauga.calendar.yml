PackageName: org.prauga.calendar
Name: Calendar
Summary: A private calendar for the events, tasks and holidays on your phone
License: GPL-3.0-or-later
AuthorName: Saalim Quadri
SourceCode: https://github.com/PVOT-OSS/Calendar
IssueTracker: https://github.com/PVOT-OSS/Calendar/issues
WebSite: ""
Categories:
  - Calendar & Agenda
CurrentVersion: "1.0.0"
CurrentVersionCode: 10000
Description: |
  Calendar shows the calendars already on your phone, from offline calendars to
  CalDAV accounts synced with DAVx5, without an account or network access of its own.
  Home gives a summary of your week and your upcoming events; Day, Week, Month and
  Year views show the rest, and events can be dragged to another time. Create and
  edit events with repeats, reminders, colours and guests, answer invitations, and
  join online meetings from the event. Dated tasks from OpenTasks or Tasks.org,
  birthdays from your contacts and public holidays can be shown alongside your
  events, and .ics files can be imported and exported.

  Calendar is based on Etar.

